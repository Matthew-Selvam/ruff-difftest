name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: 0.9.5

jobs:
  lint:
    name: Lint & parse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # ruff is pulled in ad hoc and unpinned; a lint failure here is
      # advisory, not gating.
      - name: Ruff lint (non-gating)
        continue-on-error: true
        run: |
          uv run --with ruff -- ruff check ruff_difftest.py
          uv run --with ruff -- ruff format --check ruff_difftest.py tests/
      - name: Script entrypoint and subcommands parse
        run: |
          uv run ruff_difftest.py --help
          uv run ruff_difftest.py collect --help
          uv run ruff_difftest.py run --help

  tests:
    name: Pytest suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Run pytest (hermetic, fake binaries)
        run: uv run --with pytest -- pytest tests/ -q

  # CI runners cannot build real ruff binaries (a cargo build of ruff is far
  # too heavy for this workflow), so the end-to-end differential path is
  # exercised with two tiny fake "ruff" builds from tests/fake_bin/ instead:
  # base.sh (no-op fixer) vs fixed.sh (deterministic one-shot fixer) and vs
  # nonidem.sh (never-idempotent fixer).
  smoke:
    name: Smoke difftest / fake binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # The harness treats the corpus as read-only (fresh temp copy per
      # file/build) but still writes+removes a transient ruff_difftest.toml in
      # the corpus root, so run against a copy under $RUNNER_TEMP, never the
      # checkout itself.
      - name: Smoke base-vs-fixed fake (deterministic diff)
        run: |
          chmod +x tests/fake_bin/*.sh
          rm -rf "$RUNNER_TEMP/corpus-diff" "$RUNNER_TEMP/report-diff"
          cp -R tests/smoke/corpus "$RUNNER_TEMP/corpus-diff"
          uv run ruff_difftest.py run \
            --corpus "$RUNNER_TEMP/corpus-diff" \
            --base tests/fake_bin/base.sh \
            --fixed tests/fake_bin/fixed.sh \
            --jobs 2 \
            --report "$RUNNER_TEMP/report-diff"
          python3 - "$RUNNER_TEMP/report-diff" "$RUNNER_TEMP/corpus-diff" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads((Path(sys.argv[1]) / "summary.json").read_text())
          n = len(list(Path(sys.argv[2]).rglob("*.py")))
          assert n == 3, (
              f"smoke corpus has {n} .py files, expected 3; update expectations"
          )
          expected = {
              "corpus_size": n,
              "base_converge_failures": 0,
              "fixed_converge_failures": 0,
              "base_non_idempotent": 0,
              "fixed_non_idempotent": 0,
              "differing_files": n,
              "diffs_formatter_disagrees_both": 0,
              "diffs_formatter_disagrees_only_fixed": 0,
              "errors": 0,
          }
          for key, want in expected.items():
              got = summary.get(key)
              assert got == want, (
                  f"summary.{key} = {got!r}, expected {want!r}; full: {summary}"
              )
          print("smoke OK (base vs fixed):", json.dumps(summary, sort_keys=True))
          PY
          mkdir -p smoke-report
          cp -R "$RUNNER_TEMP/report-diff" smoke-report/diff

      - name: Smoke base-vs-nonidem fake (non-idempotence detection)
        run: |
          chmod +x tests/fake_bin/*.sh
          rm -rf "$RUNNER_TEMP/corpus-nonidem" "$RUNNER_TEMP/report-nonidem"
          cp -R tests/smoke/corpus "$RUNNER_TEMP/corpus-nonidem"
          uv run ruff_difftest.py run \
            --corpus "$RUNNER_TEMP/corpus-nonidem" \
            --base tests/fake_bin/base.sh \
            --fixed tests/fake_bin/nonidem.sh \
            --jobs 2 \
            --report "$RUNNER_TEMP/report-nonidem"
          python3 - "$RUNNER_TEMP/report-nonidem" "$RUNNER_TEMP/corpus-nonidem" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads((Path(sys.argv[1]) / "summary.json").read_text())
          n = len(list(Path(sys.argv[2]).rglob("*.py")))
          assert n == 3, (
              f"smoke corpus has {n} .py files, expected 3; update expectations"
          )
          expected = {
              "corpus_size": n,
              "base_converge_failures": 0,
              "fixed_converge_failures": 0,
              "base_non_idempotent": 0,
              "fixed_non_idempotent": n,
              "differing_files": n,
              "diffs_formatter_disagrees_both": 0,
              "diffs_formatter_disagrees_only_fixed": 0,
              "errors": 0,
          }
          for key, want in expected.items():
              got = summary.get(key)
              assert got == want, (
                  f"summary.{key} = {got!r}, expected {want!r}; full: {summary}"
              )
          print("smoke OK (base vs nonidem):", json.dumps(summary, sort_keys=True))
          PY
          mkdir -p smoke-report
          cp -R "$RUNNER_TEMP/report-nonidem" smoke-report/nonidem

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-difftest-report
          path: smoke-report/
          if-no-files-found: warn
